<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Dashboard</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #eef2f7;
      padding: 20px;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .section {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    #logoutBtn {
      margin-top: 20px;
      padding: 10px 15px;
      background: red;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #clock {
      float: right;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    Welcome to Campus Connect Dashboard
    <div id="clock"></div>
  </header>

  <div class="section">
    <h3>🗓 Upcoming Event</h3>
    <p><strong>Design Workshop</strong> – May 5, 2025</p>
    <p>Topic: UI/UX Essentials</p>
  </div>

  <div class="section">
    <h3>📢 Announcements</h3>
    <ul>
      <li>New semester begins from June 10th.</li>
      <li>Exam forms available till May 30th.</li>
    </ul>
  </div>

  <div class="section">
    <h3>📞 Contact</h3>
    <p>Email: contact@campus.edu</p>
    <p>Phone: +91 98765 43210</p>
  </div>

  <button id="logoutBtn" onclick="logout()">Logout</button>

  <script>
    // Redirect back to login if not logged in
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      window.location.href = "login.html";
    }

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
